name: AthleteOSRecorder

options:
  bundleIdPrefix: nz.co.athleteos
  deploymentTarget:
    iOS: "16.0"

packages:
  PolarBleSdk:
    url: https://github.com/polarofficial/polar-ble-sdk.git
    from: 8.4.0

targets:
  AthleteOSRecorder:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.athleteos.recorder
        MARKETING_VERSION: 1.6
        CURRENT_PROJECT_VERSION: 7
        SWIFT_VERSION: 5.9
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: AthleteOS Recorder
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: AthleteOS Recorder connects to your Polar H10 to record overnight RR intervals.
        CFBundleURLTypes:
          - CFBundleURLName: nz.co.athleteos.recorder
            CFBundleURLSchemes:
              - athleteos-recorder
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
    dependencies:
      - package: PolarBleSdk
