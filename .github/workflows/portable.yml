name: Portable Recorder Safety
on:
  push:
    branches: [main]
    paths: ["Sources/**""Tests/**",".github/workflows/portable.yml"]
  pull_request:
    paths: ["Sources/**""Tests/**"]
concurrency:
  group: recorder-portable-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Portable lifecycle and connection regressions
        run: |
          swiftc Sources/RecorderCompanionPolicy.swift Sources/NightConnectionPolicy.swift Sources/RecordingModels.swift Sources/RecordingStore.swift Sources/UploadReceipt.swift Tests/RecorderRegression.swift -o /tmp/recorder-regression
          /tmp/recorder-regression
          swiftc -frontend -parse Sources/*.swift Tests/RecorderRegression.swift
          swiftc -frontend -parse Widget/*.swift
