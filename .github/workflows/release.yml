name: Release AthleteOS Recorder
on:
  workflow_dispatch:
  create:

concurrency:
  group: recorder-release
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')) }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Regression tests
        run: |
          swiftc Sources/NightConnectionPolicy.swift Sources/StreamHealthPolicy.swift Sources/RecordingModels.swift Sources/RecordingStore.swift Sources/ResearchCaptureStore.swift Sources/UploadReceipt.swift Sources/AthleteOSUploader.swift Tests/RecorderRegression.swift -o /tmp/recorder-regression
          /tmp/recorder-regression

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon assets
        run: python3 Scripts/generate_app_icons.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache pinned Polar dependencies
        uses: actions/cache@v4
        with:
          path: .swift-packages
          key: polar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}

      - name: Resolve Polar BLE SDK
        run: xcodebuild -resolvePackageDependencies -clonedSourcePackagesDirPath .swift-packages -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder

      - name: Compile iPhone simulator
        run: xcodebuild -clonedSourcePackagesDirPath .swift-packages -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder -configuration Debug -sdk iphonesimulator -derivedDataPath build-simulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned device app
        run: xcodebuild -clonedSourcePackagesDirPath .swift-packages -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Validate app bundle
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/AthleteOSRecorder.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "Built Recorder version=$VERSION build=$BUILD"
          test "$VERSION" = "2.1.8"
          test "$BUILD" = "25"

          # Preserve the existing Home Screen night recorder widget.
          WIDGET="$APP/PlugIns/RecorderWidget.appex"
          test -d "$WIDGET"
          WIDGET_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WIDGET/Info.plist")
          WIDGET_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WIDGET/Info.plist")
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET/Info.plist")
          echo "Widget bundle=$WIDGET_BUNDLE version=$WIDGET_VERSION build=$WIDGET_BUILD"
          test "$WIDGET_BUNDLE" = "nz.co.athleteos.recorder.widget"
          test "$WIDGET_VERSION" = "$VERSION"
          test "$WIDGET_BUILD" = "$BUILD"

          # Verify the actual built app, not just source assets. iOS app icons may
          # be emitted as PNGs beside Assets.car rather than listed by assetutil.
          test -s "$APP/Assets.car"
          plutil -p "$APP/Info.plist" > /tmp/app-info.txt
          grep -q 'AppIcon' /tmp/app-info.txt || {
            echo "Built app is missing AppIcon metadata."
            cat /tmp/app-info.txt
            exit 1
          }
          ICON_COUNT=$(find "$APP" -maxdepth 1 -type f -name '*AppIcon*.png' | wc -l | tr -d ' ')
          if [ "$ICON_COUNT" -lt 1 ]; then
            echo "Built app contains no compiled AppIcon PNG."
            find "$APP" -maxdepth 1 -type f -print
            exit 1
          fi
          echo "Compiled Home Screen AppIcon verified ($ICON_COUNT PNG file(s))."

          # Background BLE is required for locked-phone streaming.
          BG=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist")
          echo "Background mode=$BG"
          test "$BG" = "bluetooth-central"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload AthleteOSRecorder.ipa
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/AthleteOSRecorder.app Payload/
          zip -qry AthleteOSRecorder.ipa Payload
          test -s AthleteOSRecorder.ipa

      - name: Publish GitHub Release IPA then SideStore metadata
        env:
          REPO: Seedytim/-athleteos-recorder-build
          GH_TOKEN: ${{ github.token }}
          SIDE_SOURCE_URL: https://athleteos-pink-sigma.vercel.app/recorder/source.json
          SIDE_ICON_URL: https://athleteos-pink-sigma.vercel.app/recorder/icon.png
        run: |
          set -euo pipefail

          APP="build-device/Build/Products/Release-iphoneos/AthleteOSRecorder.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          SIZE=$(stat -f%z AthleteOSRecorder.ipa)
          SHA256=$(shasum -a 256 AthleteOSRecorder.ipa | awk '{print $1}')
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE=$(git rev-parse HEAD)
          TAG="recorder-v${VERSION}-build${BUILD}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/AthleteOSRecorder.ipa"

          git config user.name "Seedytim"
          git config user.email "103544048+Seedytim@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE" ]; then
            echo "main changed during release; refusing to publish a stale IPA."
            exit 1
          fi

          # Publish the exact validated IPA as a native GitHub Release asset.
          # This avoids raw.githubusercontent.com socket resets and avoids any
          # binary proxy transforming or confusing SideStore's bundle inspection.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" AthleteOSRecorder.ipa#AthleteOSRecorder.ipa --repo "$REPO" --clobber
          else
            gh release create "$TAG" AthleteOSRecorder.ipa#AthleteOSRecorder.ipa \
              --repo "$REPO" \
              --title "AthleteOS Recorder ${VERSION} (${BUILD})" \
              --notes "SideStore release for AthleteOS Recorder ${VERSION} build ${BUILD}."
          fi

          # Prove the release CDN serves byte-for-byte the IPA that passed bundle
          # validation before the SideStore feed can advertise it.
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_URL" -o /tmp/release.ipa
          REMOTE_SIZE=$(stat -f%z /tmp/release.ipa)
          REMOTE_SHA=$(shasum -a 256 /tmp/release.ipa | awk '{print $1}')
          test "$REMOTE_SIZE" = "$SIZE"
          test "$REMOTE_SHA" = "$SHA256"

          mkdir -p dist
          python3 - "$VERSION" "$BUILD" "$SIZE" "$SHA256" "$SOURCE" "$TAG" "$DOWNLOAD_URL" "$DATE" "$SIDE_SOURCE_URL" "$SIDE_ICON_URL" <<'PY'
          import json, sys
          version, build, size, sha256, source, tag, download, date, source_url, icon_url = sys.argv[1:]
          build_meta = {
              "version": version,
              "build": build,
              "size": int(size),
              "sha256": sha256,
              "source_commit": source,
              "release_tag": tag,
              "download_url": download,
          }
          feed = {
              "name": "AthleteOS Recorder",
              "identifier": "nz.co.athleteos.recorder.source",
              "sourceURL": source_url,
              "apps": [{
                  "name": "AthleteOS Recorder",
                  "bundleIdentifier": "nz.co.athleteos.recorder",
                  "developerName": "AthleteOS",
                  "localizedDescription": "Raw Polar H10 overnight recorder. AthleteOS performs all analysis and coaching.",
                  "iconURL": icon_url,
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": date,
                      "localizedDescription": "Targets Polar H10 PFTP 106 by forcing and verifying single-BLE-connection mode before Start night and before retained RR fetch, then reasserting single mode after any 106 reconnect. Keeps the H10 sensor copy until AthleteOS verifies upload.",
                      "downloadURL": download,
                      "size": int(size),
                      "minOSVersion": "16.0",
                  }],
              }],
          }
          with open("dist/build.json", "w") as f:
              json.dump(build_meta, f, indent=2)
              f.write("\n")
          with open("dist/source.json", "w") as f:
              json.dump(feed, f, indent=2)
              f.write("\n")
          PY

          # Cross-check feed metadata against the exact release asset again.
          python3 - "$VERSION" "$BUILD" "$SIZE" "$SHA256" "$DOWNLOAD_URL" <<'PY'
          import hashlib, json, sys, urllib.request
          version, build, size, sha256, expected_url = sys.argv[1:]
          meta = json.load(open("dist/build.json"))
          feed = json.load(open("dist/source.json"))
          v = feed["apps"][0]["versions"][0]
          assert meta["version"] == version == v["version"]
          assert str(meta["build"]) == str(build) == str(v["buildVersion"])
          assert int(meta["size"]) == int(size) == int(v["size"])
          assert meta["sha256"] == sha256
          assert meta["download_url"] == expected_url == v["downloadURL"]
          with urllib.request.urlopen(expected_url, timeout=90) as r:
              data = r.read()
          assert len(data) == int(size)
          assert hashlib.sha256(data).hexdigest() == sha256
          print("SideStore metadata and GitHub Release IPA agree byte-for-byte.")
          PY

          # Publish metadata only after the release asset is verified.
          git add dist/build.json dist/source.json
          git commit -m "Publish AthleteOS Recorder metadata ${VERSION} (${BUILD})"
          git push origin HEAD:main

          # Verify the production SideStore source converges to the same direct
          # GitHub Release asset, then download through the exact URL SideStore sees
          # and re-check bytes one final time.
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fL -H "Cache-Control: no-cache" "${SIDE_SOURCE_URL}?v=${SOURCE}-${BUILD}-${attempt}" -o /tmp/live-source.json; then
              LIVE_DOWNLOAD=$(python3 - "$VERSION" "$BUILD" "$SIZE" "$DOWNLOAD_URL" <<'PY'
          import json, sys
          version, build, size, expected = sys.argv[1:]
          feed = json.load(open("/tmp/live-source.json"))
          v = feed["apps"][0]["versions"][0]
          assert v["version"] == version
          assert str(v["buildVersion"]) == str(build)
          assert int(v["size"]) == int(size)
          assert v["downloadURL"] == expected
          print(v["downloadURL"])
          PY
              ) || true
              if [ "$LIVE_DOWNLOAD" = "$DOWNLOAD_URL" ]; then
                curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$LIVE_DOWNLOAD" -o /tmp/live.ipa
                LIVE_SIZE=$(stat -f%z /tmp/live.ipa)
                LIVE_SHA=$(shasum -a 256 /tmp/live.ipa | awk '{print $1}')
                test "$LIVE_SIZE" = "$SIZE"
                test "$LIVE_SHA" = "$SHA256"
                echo "Production SideStore feed and downloaded IPA are verified byte-for-byte."
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Production SideStore source did not converge to the GitHub Release artifact."
          exit 1
