name: Validate AthleteOS Recorder
on:
  push:
    branches: [main]
    paths: ["Sources/**","Resources/**","Scripts/**","Tests/**","project.yml",".github/workflows/build.yml",".github/workflows/release.yml"]
  pull_request:
    paths: ["Sources/**","Resources/**","Scripts/**","Tests/**","project.yml"]
concurrency:
  group: recorder-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: |
          swiftc Sources/NightConnectionPolicy.swift Sources/StreamHealthPolicy.swift Sources/RecordingModels.swift Sources/RecordingStore.swift Sources/ResearchCaptureStore.swift Sources/UploadReceipt.swift Sources/AthleteOSUploader.swift Tests/RecorderRegression.swift -o /tmp/recorder-regression
          /tmp/recorder-regression
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon assets
        run: python3 Scripts/generate_app_icons.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Cache pinned Polar dependencies
        uses: actions/cache@v4
        with:
          path: .swift-packages
          key: polar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}
      - name: Resolve Polar BLE SDK
        run: xcodebuild -resolvePackageDependencies -clonedSourcePackagesDirPath .swift-packages -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder
      - name: Compile iPhone simulator
        run: xcodebuild -clonedSourcePackagesDirPath .swift-packages -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder -configuration Debug -sdk iphonesimulator -derivedDataPath build-simulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
