name: Validate AthleteOS Recorder
on:
  push:
    branches: [main]
    paths: ["Sources/**","Tests/**","project.yml",".github/workflows/build.yml",".github/workflows/release.yml"]
  pull_request:
    paths: ["Sources/**","Tests/**","project.yml"]
concurrency:
  group: recorder-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: |
          swiftc Sources/RecordingModels.swift Sources/RecordingStore.swift Sources/UploadReceipt.swift Tests/RecorderRegression.swift -o /tmp/recorder-regression
          /tmp/recorder-regression
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Polar BLE SDK
        run: xcodebuild -resolvePackageDependencies -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder
      - name: Compile iPhone simulator
        run: xcodebuild -project AthleteOSRecorder.xcodeproj -scheme AthleteOSRecorder -configuration Debug -sdk iphonesimulator -derivedDataPath build-simulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
